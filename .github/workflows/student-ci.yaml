name: Student CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out submission
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run public tests
        run: timeout 120s python -m pytest -q tests

      - name: Build webhook image
        run: timeout 90s docker compose build webhook

      - name: Check webhook inside built image
        run: timeout 35s python scripts/check_webhook_image.py
